name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk
          java -version

      - name: Set up Android SDK
        run: |
          ANDROID_SDK_ROOT="${HOME}/android-sdk"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

          # 下载 cmdline-tools
          CMDLINE_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          curl -sS -o /tmp/cmdline-tools.zip "$CMDLINE_URL"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "${ANDROID_SDK_ROOT}/cmdline-tools/latest"

          # 接受许可并安装必要组件
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" > /dev/null 2>&1

          echo "Android SDK ready."

      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Rename APKs
        id: rename
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          APK_DIR="release_assets"
          mkdir -p "$APK_DIR"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_DIR/ADR-Scan-v${VERSION_NAME}-Android6plus-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$APK_DIR/ADR-Scan-v${VERSION_NAME}-Android6plus-release-unsigned.apk"
          echo "apk_dir=$APK_DIR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Create Release and Upload APK
        env:
          TAG: ${{ github.ref_name }}
        run: |
          API="https://gitee.com/api/v5/repos/${{ github.repository }}"
          AUTH="Authorization: Bearer ${{ secrets.GITEE_TOKEN }}"

          echo "Creating release for $TAG..."
          RESP=$(curl -sS --connect-timeout 10 --max-time 30 -X POST "${API}/releases" \
            -H "$AUTH" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"ADR-Scan ${TAG}\",\"body\":\"ADR-Scan ${TAG}\",\"target_commitish\":\"main\"}")

          RELEASE_ID=$(echo "$RESP" | jq -r '.id')
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "Release creation failed, trying existing..."
            RELEASE_ID=$(curl -sS --connect-timeout 10 --max-time 30 "${API}/releases" -H "$AUTH" | jq -r ".[] | select(.tag_name==\"${TAG}\") | .id")
          fi

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "FATAL: Cannot create or find release."
            exit 1
          fi

          echo "Release ID: $RELEASE_ID"

          for apk in release_assets/*.apk; do
            fname=$(basename "$apk")
            fsize=$(du -h "$apk" | cut -f1)
            echo "Uploading $fname ($fsize)..."
            curl -sS --connect-timeout 10 --max-time 600 -X POST \
              "${API}/releases/${RELEASE_ID}/attach_files" \
              -H "$AUTH" \
              -F "file=@${apk}" && echo "  OK" || echo "  FAILED"
          done

          echo "Release done: https://gitee.com/${{ github.repository }}/releases/tag/${TAG}"
