name: Build and Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          validate-wrappers: false

      - name: Build APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | sed -E "s/.*\"(.*)\".*/\1/")
          APK_DIR="release_assets"

          mkdir -p "$APK_DIR"

          # Debug
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_DIR/ADR-Scan-v${VERSION_NAME}-debug.apk"
          # Release (unsigned, for local install)
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$APK_DIR/ADR-Scan-v${VERSION_NAME}-release-unsigned.apk"

          # Zip for Android direct download (avoid .dat rename by Chinese ROM browsers)
          for apk in *.apk; do
            zip "${apk%.apk}.zip" "$apk"
          done

          echo "apk_dir=$APK_DIR" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_ENV
        id: rename

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADR-Scan
          path: release_assets/
          retention-days: 90

  release:
    needs: build
    # 仅 tag 推送或手动触发时创建 Release
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ADR-Scan

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            *.apk *.zip \
            || gh release upload "$TAG" *.apk *.zip --repo "${{ github.repository }}" --clobber
