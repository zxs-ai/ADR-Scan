name: Build and Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          validate-wrappers: false

      # ── 仅 main/master 分支自动升 patch 版本 ──────────────────
      - name: Auto bump version
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        id: bump
        run: |
          # 已经是版本号递增提交则跳过，防止死循环
          if git log -1 --pretty=%B | grep -q "chore: auto bump"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT_VERSION=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"

          CURRENT_CODE=$(grep 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          NEW_CODE=$((CURRENT_CODE + 1))

          sed -i "s/versionName = \"$CURRENT_VERSION\"/versionName = \"$NEW_VERSION\"/" app/build.gradle.kts
          sed -i "s/versionCode = $CURRENT_CODE/versionCode = $NEW_CODE/" app/build.gradle.kts

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # ── 构建 APK ──────────────────────────────────────────────
      - name: Build APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Rename APKs
        id: rename
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          APK_DIR="release_assets"
          mkdir -p "$APK_DIR"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_DIR/ADR-Scan-v${VERSION_NAME}-Android6plus-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$APK_DIR/ADR-Scan-v${VERSION_NAME}-Android6plus-release-unsigned.apk"
          for apk in "$APK_DIR"/*.apk; do
            zip -j "${apk%.apk}.zip" "$apk"
          done
          echo "apk_dir=$APK_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADR-Scan
          path: release_assets/
          retention-days: 90

      # ── 推送版本号递增提交 ────────────────────────────────────
      - name: Commit version bump
        if: steps.bump.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore: auto bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push

      # ── 创建 Release (main 分支自动) ──────────────────────────
      - name: Create Release (auto)
        if: steps.bump.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.bump.outputs.new_version }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            release_assets/*.apk release_assets/*.zip \
            || gh release upload "$TAG" release_assets/*.apk release_assets/*.zip --repo "${{ github.repository }}" --clobber

      # ── 创建 Release (tag 推送 / 手动触发) ────────────────────
      - name: Create Release (tag or manual)
        if: |
          startsWith(github.ref, 'refs/tags/v') ||
          github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            release_assets/*.apk release_assets/*.zip \
            || gh release upload "$TAG" release_assets/*.apk release_assets/*.zip --repo "${{ github.repository }}" --clobber

      # ── 同步到 Gitee ──────────────────────────────────────────
      - name: Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN not set, skipping Gitee sync"
            exit 0
          fi
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/applexyz/adr-scan.git"
          git push gitee --all  --force
          git push gitee --tags --force

      - name: Create Gitee Release
        if: |
          (steps.bump.outputs.skip == 'false') ||
          startsWith(github.ref, 'refs/tags/v') ||
          github.event_name == 'workflow_dispatch'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN not set, skipping."
            exit 0
          fi
          if [ "${{ steps.bump.outputs.skip }}" = "false" ]; then
            TAG="v${{ steps.bump.outputs.new_version }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          API="https://gitee.com/api/v5/repos/applexyz/adr-scan"
          AUTH="Authorization: Bearer ${GITEE_TOKEN}"
          CURL="curl -sS --connect-timeout 10 --max-time 30"

          # 查已有 release（tag push 后 Gitee 可能已自动创建）
          EXISTING=$($CURL "${API}/releases" -H "$AUTH" | jq -r ".[] | select(.tag_name==\"${TAG}\") | .id")

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "Gitee release already exists for $TAG (id=$EXISTING)"
            # 更新 body 为干净描述
            $CURL -X PATCH "${API}/releases/${EXISTING}" \
              -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"body\":\"ADR-Scan ${TAG}\"}" > /dev/null
          else
            echo "Creating Gitee release for $TAG..."
            $CURL -X POST "${API}/releases" \
              -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"ADR-Scan ${TAG}\",\"target_commitish\":\"main\"}" > /dev/null
          fi

          echo "Gitee release done."
          echo "NOTE: APK files cannot be uploaded from GH Actions to Gitee due to cross-border network restrictions."
          echo "APK downloads are available on this repo's GitHub Releases, or build from source on Gitee."
